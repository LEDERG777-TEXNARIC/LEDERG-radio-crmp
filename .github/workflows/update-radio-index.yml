name: Refresh radio station index

on:
  push:
    branches: [main]
    paths-ignore:
      - "radio-index.json"

permissions:
  contents: write

jobs:
  refresh-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate station index
        run: python3 generate_radio_index.py

      - name: Commit index if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radio-index.json
          if git diff --cached --quiet; then
            echo "Radio index is already current."
          else
            git commit -m "chore: refresh radio index [skip ci]"
            git push origin HEAD:main
          fi
